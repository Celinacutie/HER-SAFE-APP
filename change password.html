<!DOCTYPE html>
<html lang="eng">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>change_password</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body class="body_change">
        <div class="change_password" style="background-color: aquamarine;line-height: 50px;">
            <h1>Change password</h1>
            <p><label>Current password:</label><input type="text" placeholder="Enter your current password"></p>
            <p><label>New  password:</label><input type="text" placeholder="Enter your new password"></p>
            <p><label>Confirm new password:</label><input type="text" placeholder="Confirm your new password"</p>
            <p><button onclick="alert('Password changed')">Change password</button></p>
        </div>
    </body>
</html>
